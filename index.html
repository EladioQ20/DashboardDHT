<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard LoRa + Supabase Realtime</title>

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* General */
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f5f8;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 2em;
      color: #007bff;
    }

    /* Contenedor de gráficas */
    .charts {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }
    .chart-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 500px;
    }

    /* Tabla */
    table {
      width: 100%;
      border-collapse: collapse;
      background:white;
      border-radius:8px;
      overflow:hidden;
      margin-top:20px;
      max-height: 400px;
      display: block;
      overflow-y: auto;
    }
    table thead tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
    table tbody {
      display: block;
      width: 100%;
    }
    table th, table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 0.9em;
    }
    table th {
      background: #007bff;
      color: white;
      position: sticky;
      top: 0;
    }

    /* Botón Export CSV */
    #exportCSV {
      display: block;
      margin: 15px auto;
      padding: 10px 20px;
      border:none;
      border-radius:6px;
      background:#28a745;
      color:white;
      font-weight:bold;
      font-size:1em;
      cursor:pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }
    #exportCSV:hover {
      background:#218838;
    }

    @media (max-width: 1100px){
      .charts { flex-direction: column; align-items: center; }
      .chart-container { width: 90%; }
    }
  </style>
</head>

<body>
<h1>Dashboard LoRa + Supabase Realtime</h1>

<div class="charts">
  <div class="chart-container">
    <canvas id="tempChart"></canvas>
  </div>
  <div class="chart-container">
    <canvas id="humChart"></canvas>
  </div>
</div>

<button id="exportCSV">Exportar CSV</button>

<table id="dataTable">
  <thead>
    <tr>
      <th>Ciclo</th>
      <th>Nodo</th>
      <th>Temp (°C)</th>
      <th>Humedad (%)</th>
      <th>Tipo</th>
      <th>RSSI</th>
      <th>SNR</th>
      <th>Fecha/Hora</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  // ----------------------------
  // CONFIGURACIÓN SUPABASE
  // ----------------------------
  const SUPABASE_URL = "https://ncoieieeihooveochnbl.supabase.co";
  const SUPABASE_KEY = " eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jb2llaWVlaWhvb3Zlb2NobmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MzA5OTYsImV4cCI6MjA5NDMwNjk5Nn0.vNikTtSyXcdJITxsGKItxxJdRPD4nZkR7CtNjVtfHzY";
  const SUPABASE_TABLE = "lora_dht_readings";

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ----------------------------
  // VARIABLES GLOBALES
  // ----------------------------
  const tempCtx = document.getElementById("tempChart").getContext("2d");
  const humCtx  = document.getElementById("humChart").getContext("2d");
  const dataTableBody = document.querySelector("#dataTable tbody");

  let tempChart = new Chart(tempCtx, {
    type:"line",
    data:{ labels:[], datasets:[
      { label:"TX1", data:[], borderColor:"red", fill:false, tension:0.2 },
      { label:"RX_SIM", data:[], borderColor:"blue", fill:false, tension:0.2 }
    ]},
    options:{ responsive:true, plugins:{legend:{position:"top"}}, scales:{y:{beginAtZero:true}} }
  });

  let humChart = new Chart(humCtx, {
    type:"line",
    data:{ labels:[], datasets:[
      { label:"TX1", data:[], borderColor:"red", fill:false, tension:0.2 },
      { label:"RX_SIM", data:[], borderColor:"blue", fill:false, tension:0.2 }
    ]},
    options:{ responsive:true, plugins:{legend:{position:"top"}}, scales:{y:{beginAtZero:true}} }
  });

  let latestCycleData = {};

  function addDataToCharts(ciclo, tx1Temp, rxSimTemp, tx1Hum, rxSimHum){
    tempChart.data.labels.push(ciclo);
    tempChart.data.datasets[0].data.push(tx1Temp);
    tempChart.data.datasets[1].data.push(rxSimTemp);

    humChart.data.labels.push(ciclo);
    humChart.data.datasets[0].data.push(tx1Hum);
    humChart.data.datasets[1].data.push(rxSimHum);

    // Limitar últimos 50 ciclos
    if(tempChart.data.labels.length>50){
      tempChart.data.labels.shift();
      tempChart.data.datasets.forEach(ds=>ds.data.shift());
      tempChart.update();

      humChart.data.labels.shift();
      humChart.data.datasets.forEach(ds=>ds.data.shift());
      humChart.update();
    } else {
      tempChart.update();
      humChart.update();
    }
  }

  function addRowToTable(row){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.cycle_id}</td>
      <td>${row.node_id}</td>
      <td>${row.temperature}</td>
      <td>${row.humidity}</td>
      <td>${row.data_type}</td>
      <td>${row.rssi ?? ""}</td>
      <td>${row.snr ?? ""}</td>
      <td>${new Date(row.created_at).toLocaleString()}</td>
    `;
    dataTableBody.appendChild(tr);
  }

  function exportTableToCSV(filename="data.csv"){
    let csv=[];
    const rows=document.querySelectorAll("table tr");
    rows.forEach(row=>{
      let cols=row.querySelectorAll("th, td");
      let data=[];
      cols.forEach(col=>data.push(col.innerText));
      csv.push(data.join(","));
    });
    const blob = new Blob([csv.join("\n")],{type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }
  document.getElementById("exportCSV").addEventListener("click", exportTableToCSV);

  async function loadHistoricalData(){
    const { data, error } = await supabase.from(SUPABASE_TABLE)
      .select("*").order("created_at",{ascending:true});
    if(error){ console.error(error); return; }

    data.forEach(row=>addRowToTable(row));

    const cycles=[...new Set(data.map(d=>d.cycle_id))].slice(-50);
    cycles.forEach(ciclo=>{
      const tx1 = data.find(d=>d.cycle_id==ciclo && d.node_id=="TX1");
      const rxSim = data.find(d=>d.cycle_id==ciclo && d.node_id=="RX_SIM");
      if(tx1 && rxSim) addDataToCharts(ciclo, tx1.temperature, rxSim.temperature, tx1.humidity, rxSim.humidity);
    });
  }

  // ----------------------------
  // SUSCRIPCION REALTIME OPTIMIZADA
  // ----------------------------
  supabase.channel('table-db-changes')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:SUPABASE_TABLE }, payload=>{
      const row=payload.new;
      const ciclo=row.cycle_id;
      const nodo=row.node_id;

      if(!latestCycleData[ciclo]) latestCycleData[ciclo]={};
      latestCycleData[ciclo][nodo]=row;

      addRowToTable(row);

      const cicloData = latestCycleData[ciclo];
      if(cicloData.TX1 && cicloData.RX_SIM){
        addDataToCharts(
          ciclo,
          cicloData.TX1.temperature, 
          cicloData.RX_SIM.temperature,
          cicloData.TX1.humidity,
          cicloData.RX_SIM.humidity
        );
      }
    })
    .subscribe();

  loadHistoricalData();
</script>
</body>
</html>
