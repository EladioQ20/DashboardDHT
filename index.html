<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard LoRa + Supabase Realtime</title>

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; margin:20px; background:#f2f5f8; color:#333; }
    h1 { text-align:center; margin-bottom:25px; font-size:2em; color:#007bff; }
    .charts { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-bottom:25px; }
    .chart-container { background:white; padding:20px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width:500px; }
    table { width:100%; border-collapse: collapse; background:white; border-radius:8px; overflow:hidden; margin-top:20px; max-height:400px; display:block; overflow-y:auto; }
    table thead tr { display:table; width:100%; table-layout: fixed; }
    table tbody { display:block; width:100%; }
    table th, table td { border:1px solid #ddd; padding:8px; text-align:center; font-size:0.9em; }
    table th { background:#007bff; color:white; position:sticky; top:0; }
    #exportCSV { display:block; margin:15px auto; padding:10px 20px; border:none; border-radius:6px; background:#28a745; color:white; font-weight:bold; cursor:pointer; box-shadow:0 3px 6px rgba(0,0,0,0.15); }
    #exportCSV:hover { background:#218838; }
    @media (max-width: 1100px){ .charts { flex-direction: column; align-items: center; } .chart-container { width: 90%; } }
  </style>
</head>

<body>
<h1>Dashboard LoRa + Supabase Realtime</h1>

<div class="charts">
  <div class="chart-container">
    <canvas id="tempChart"></canvas>
  </div>
  <div class="chart-container">
    <canvas id="humChart"></canvas>
  </div>
</div>

<button id="exportCSV">Exportar CSV</button>

<table id="dataTable">
  <thead>
    <tr>
      <th>Ciclo</th>
      <th>Nodo</th>
      <th>Temp (°C)</th>
      <th>Humedad (%)</th>
      <th>Tipo</th>
      <th>RSSI</th>
      <th>SNR</th>
      <th>Fecha/Hora</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Archivo JavaScript separado -->
<script src="app.js"></script>

</body>
</html>
